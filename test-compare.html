<!DOCTYPE html>
<html>
<head>
    <title>Compare with TradingView</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0d1117; color: #c9d1d9; }
        .signal { padding: 10px; margin: 5px 0; border-left: 4px solid; }
        .buy { border-color: #26a69a; background: rgba(38, 166, 154, 0.1); }
        .sell { border-color: #ef5350; background: rgba(239, 83, 80, 0.1); }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
        #output { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔍 Compare Signals with TradingView</h1>
    
    <div>
        <label>Token: <input id="token" value="BTC" /></label>
        <label>Timeframe: <input id="timeframe" value="1H" /></label>
        <label>Limit: <input id="limit" value="300" type="number" /></label>
        <button onclick="testSignals()">Test Signals</button>
        <button onclick="enableDebug()">Enable Debug Mode</button>
    </div>
    
    <div id="output"></div>
    
    <script src="signals-3a.js"></script>
    <script>
        let debugMode = false;
        
        function enableDebug() {
            debugMode = true;
            alert('Debug mode enabled. Check console for detailed logs.');
        }
        
        async function testSignals() {
            const token = document.getElementById('token').value;
            const timeframe = document.getElementById('timeframe').value;
            const limit = document.getElementById('limit').value;
            const symbol = `${token}-USDT-SWAP`; // Perpetual Futures
            
            const output = document.getElementById('output');
            output.innerHTML = '<p>Loading FUTURES data...</p>';
            
            try {
                // Fetch data from OKX
                const url = `https://www.okx.com/api/v5/market/candles?instId=${symbol}&bar=${timeframe}&limit=${limit}`;
                const response = await fetch(url);
                const json = await response.json();
                
                if (json.code !== '0' || !json.data) {
                    output.innerHTML = '<p style="color: red;">Error loading data</p>';
                    return;
                }
                
                const data = json.data.reverse().map(candle => ({
                    time: parseInt(candle[0]) / 1000,
                    open: parseFloat(candle[1]),
                    high: parseFloat(candle[2]),
                    low: parseFloat(candle[3]),
                    close: parseFloat(candle[4]),
                    volume: parseFloat(candle[5])
                }));
                
                console.log(`Loaded ${data.length} candles for ${symbol} ${timeframe}`);
                
                // Detect signals
                const detector = new SignalDetector3A();
                if (debugMode) {
                    detector.params.debugMode = true;
                }
                
                const signals = [];
                
                for (let i = 50; i < data.length; i++) {
                    const tempDetector = new SignalDetector3A();
                    if (debugMode) {
                        tempDetector.params.debugMode = true;
                    }
                    
                    const historicalData = data.slice(0, i + 1);
                    const signal = tempDetector.detectSignals(historicalData);
                    
                    if (signal) {
                        const candle = data[i];
                        signals.push({
                            ...signal,
                            index: i,
                            time: new Date(candle.time * 1000).toLocaleString(),
                            timestamp: candle.time * 1000,
                            candle: candle
                        });
                    }
                }
                
                // Display results
                let html = `<h2>Found ${signals.length} signals for ${symbol} ${timeframe}</h2>`;
                
                signals.forEach((sig, idx) => {
                    const className = sig.type === 'BUY' ? 'buy' : 'sell';
                    html += `
                        <div class="signal ${className}">
                            <strong>#${idx + 1} - ${sig.type}</strong> at ${sig.time}<br>
                            Index: ${sig.index} | Entry: $${sig.entry.toFixed(2)} | SL: $${sig.sl.toFixed(2)} | TP: $${sig.tp.toFixed(2)} | Risk: ${sig.risk}%<br>
                            Candle: O=${sig.candle.open.toFixed(2)} H=${sig.candle.high.toFixed(2)} L=${sig.candle.low.toFixed(2)} C=${sig.candle.close.toFixed(2)} V=${sig.candle.volume.toFixed(0)}
                        </div>
                    `;
                });
                
                output.innerHTML = html;
                
                console.log('All signals:', signals);
                
            } catch (error) {
                output.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
